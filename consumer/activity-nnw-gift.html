<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>暖暖窩活動｜發票載具 App 互動 Demo</title>
<style>
  :root{
    /* 發票載具 design system（保留品牌識別） */
    --green600:#01AFA2;--green700:#019F93;--green100:#E6F7F6;--green300:#8ADAD4;
    --orange600:#FF9924;--orange700:#E88B21;--orange100:#FFF5E9;--orange300:#FFD09A;
    /* 暖色底層（取代原本冷灰 #F5F5F5 / #FFFFFF 的大面積留白） */
    --cream:#FFF4E6;        /* 頁面底 */
    --card:#FFFCF6;         /* 卡片底 */
    --line:#F2E3CE;         /* 暖色分隔線 */
    --ink:#3F3128;          /* 暖黑字（取代 #262626 冷黑） */
    --ink2:#7C6553;         /* 次要字 */
    --coral:#FF8C7A;--gold:#F0A64A;--brown:#8A5A2B;
    --teal:#6CC5C1;         /* 取樣自 Warm Nest 插畫背景 */
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:"PingFang TC","Noto Sans TC","SF Pro",-apple-system,sans-serif;
    background:#E9D9C3;padding:24px;display:flex;flex-wrap:wrap;gap:56px 28px;justify-content:center;
    color:var(--ink);
  }
  .note{width:100%;max-width:980px;background:#FFFBEC;border:1px solid #EBD08A;border-radius:10px;
    padding:14px 18px;font-size:13px;color:#5c4a00;line-height:1.7;}
  .note b{color:#a35b00;}
  .frame{position:relative;margin:0 48px;}
  .phone{width:375px;background:var(--cream);border-radius:28px;overflow:hidden;
    box-shadow:0 10px 28px rgba(90,60,30,0.22);border:6px solid #2B2320;}
  .status{height:24px;background:#fff;}
  .col-title{font-size:12px;text-align:center;padding:5px 0;background:#2B2320;color:#F6E4CC;
    border-radius:6px 6px 0 0;}
  .len{font-size:11px;color:#7a6142;text-align:center;padding-top:6px;}

  /* ===== 共用 ===== */
  .hand{font-family:'LXGW WenKai TC','PingFang TC',cursive;}
  .nav{height:44px;display:flex;align-items:center;justify-content:center;background:#fff;
    font-size:17px;font-weight:600;color:var(--ink);position:relative;border-bottom:1px solid var(--line);}
  .nav .h{position:absolute;left:14px;font-size:13px;color:var(--green700);}
  .scr{background:var(--cream);}

  /* ===== 畫面 A：推薦活動卡 ===== */
  .sec{padding:16px 16px 0;}
  .sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .sec-h .t{font-size:16px;font-weight:700;color:var(--ink);}
  .promo{height:84px;border-radius:14px;overflow:hidden;background:var(--card);display:flex;
    box-shadow:0 2px 8px rgba(120,80,40,0.09);border:1px solid var(--line);}
  .promo .ph{width:84px;flex-shrink:0;background:var(--teal);display:flex;align-items:center;
    justify-content:center;font-size:32px;overflow:hidden;}
  .promo .ph img{width:100%;height:100%;object-fit:cover;}
  .promo .body{flex:1;padding:9px 12px;display:flex;flex-direction:column;justify-content:center;
    gap:3px;min-width:0;}
  .promo .tag{align-self:flex-start;background:var(--orange100);color:var(--orange700);font-size:11px;
    font-weight:700;padding:1px 8px;border-radius:8px;}
  .promo .ti{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .promo .sub{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .promo.other{margin-top:10px;opacity:0.5;}

  /* ===== 畫面 B：活動詳情頁（版面已壓縮） ===== */
  .hero{height:172px;position:relative;overflow:hidden;background:var(--teal);}
  .hero>img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 40%;}
  .hero .badge{position:absolute;top:10px;right:10px;background:rgba(255,255,255,0.96);border-radius:20px;
    padding:4px 11px;font-size:11px;font-weight:700;color:var(--orange700);box-shadow:0 2px 6px rgba(0,0,0,0.1);}
  .hero .storebar{position:absolute;left:0;right:0;bottom:0;padding:20px 12px 9px;
    background:linear-gradient(transparent,rgba(45,30,20,0.72));color:#fff;display:flex;
    justify-content:space-between;align-items:flex-end;gap:8px;}
  .hero .storebar .n{font-size:15px;font-weight:700;line-height:1.3;}
  .hero .storebar .a{font-size:11px;opacity:0.9;}

  .gift-row{display:flex;gap:8px;padding:0;align-items:center;margin-bottom:12px;}
  .offer-tag{display:inline-block;background:var(--green100);color:var(--green700);font-size:11px;
    font-weight:700;padding:3px 10px;border-radius:10px;margin-bottom:6px;}
  .mini-label{font-size:12px;font-weight:700;color:var(--brown);margin-bottom:6px;}
  .gift-row .g{flex:1;border-radius:13px;height:78px;background:linear-gradient(180deg,#FFF3DE,#FFE7C4);
    border:1px solid #F3DCB8;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .gift-row .g svg{width:54px;height:40px;display:block;}
  .gift-row .g .gname{font-size:15px;color:var(--brown);}

  .detail-body{padding:12px 14px 0;}
  h1.act-title{font-size:18px;font-weight:700;color:var(--ink);margin:0 0 2px;line-height:1.4;}
  .squig-title{width:126px;height:8px;display:block;margin-bottom:7px;}
  .act-desc{font-size:13px;color:var(--ink2);line-height:1.75;margin:0 0 10px;}
  .card{background:var(--card);border-radius:13px;padding:12px 14px;margin-bottom:10px;
    border:1px solid var(--line);}
  .card h3{font-size:13px;font-weight:700;color:var(--ink);margin:0 0 8px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .step{display:flex;gap:8px;margin-bottom:7px;}
  .step:last-child{margin-bottom:0;}
  .step .n{width:19px;height:19px;border-radius:50%;background:var(--gold);color:#fff;font-size:11px;
    font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .step .t{font-size:12.5px;color:var(--ink);line-height:1.5;}
  .tos{font-size:11.5px;color:var(--ink2);line-height:1.65;margin:0;padding-left:14px;}
  .tos .tbd{color:var(--orange700);font-weight:700;background:var(--orange100);padding:0 4px;border-radius:4px;}
  .cta{display:block;text-decoration:none;margin:2px 14px 14px;background:var(--green600);color:#fff;text-align:center;padding:12px;
    border-radius:13px;font-size:15px;font-weight:700;box-shadow:0 4px 12px rgba(1,175,162,0.28);}
  .cta .s{display:block;font-size:11px;font-weight:400;opacity:0.9;margin-top:2px;}
  .already-here{display:block;text-decoration:none;text-align:center;font-size:12px;color:var(--ink2);margin:-6px 14px 16px;}
  .already-here b{color:var(--green700);font-weight:700;}

  /* ===== 畫面 B2：顧客核銷頁（出示給店員看） ===== */
  .redeem-hero{padding:28px 20px 8px;text-align:center;}
  .redeem-hero .rt{font-size:13px;color:var(--ink2);margin-bottom:2px;}
  .redeem-hero .rn{font-size:17px;font-weight:700;color:var(--ink);}
  .qr-card{background:#fff;border-radius:18px;margin:14px 20px;padding:20px;text-align:center;
    box-shadow:0 4px 14px rgba(90,60,30,0.12);border:1px solid var(--line);}
  .qr-card img{width:168px;height:168px;display:block;margin:0 auto;}
  .qr-card .code{font-family:monospace;font-size:13px;color:var(--ink2);margin-top:10px;letter-spacing:1px;}
  .qr-card .hint{font-size:12px;color:var(--ink2);margin-top:6px;}
  .qr-status{display:inline-flex;align-items:center;gap:5px;background:var(--green100);color:var(--green700);
    font-size:12px;font-weight:700;padding:4px 12px;border-radius:14px;margin:0 20px 14px;}
  .qr-status .dot{width:7px;height:7px;border-radius:50%;background:var(--green600);animation:blink 1.6s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
  .redeem-rule{margin:0 20px;font-size:11.5px;color:var(--ink2);line-height:1.7;text-align:center;}
  .qr-status.done{background:var(--green600);color:#fff;}
  .qr-status.done .dot{background:#fff;animation:none;}

  /* ===== 畫面 B3：核銷完成收尾狀態 ===== */
  .done-card{background:#fff;border-radius:18px;margin:14px 20px;padding:26px 20px;text-align:center;
    box-shadow:0 4px 14px rgba(90,60,30,0.12);border:1px solid var(--line);}
  .done-icon{width:56px;height:56px;border-radius:50%;background:var(--green600);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px;}
  .done-title{font-size:15px;font-weight:700;color:var(--ink);}
  .done-sub{font-size:12px;color:var(--ink2);margin-top:6px;}

  /* ===== 畫面 C2：商家核銷確認 ===== */
  .scan-result{background:#fff;border-radius:16px;margin:16px;padding:20px;text-align:center;
    box-shadow:0 4px 14px rgba(90,60,30,0.12);border:1px solid var(--line);}
  .scan-result .ok{width:52px;height:52px;border-radius:50%;background:var(--green600);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 10px;}
  .scan-result .name{font-size:16px;font-weight:700;color:var(--ink);}
  .scan-result .meta{font-size:12px;color:var(--ink2);margin-top:4px;}
  .pick-row{display:flex;gap:10px;margin:16px;}
  .pick{flex:1;border:2px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;
    background:var(--card);}
  .pick.sel{border-color:var(--green600);background:var(--green100);}
  .pick svg{width:44px;height:36px;display:block;margin:0 auto 4px;}
  .pick .gname{font-size:13px;color:var(--brown);}
  .confirm-btn{margin:4px 16px 16px;background:var(--green600);color:#fff;text-align:center;padding:14px;
    border-radius:14px;font-size:15px;font-weight:700;box-shadow:0 4px 12px rgba(1,175,162,0.28);}
  .confirm-btn.disabled{background:var(--line);color:var(--ink2);box-shadow:none;font-weight:400;}

  /* ===== 畫面 C：商家端核銷 ===== */
  .merch-body{padding:16px;}
  .counter{background:var(--card);border-radius:14px;padding:16px;text-align:center;margin-bottom:12px;
    border:1px solid var(--line);}
  .counter .num{font-size:34px;font-weight:700;color:var(--green700);line-height:1;}
  .counter .lbl{font-size:12px;color:var(--ink2);margin-top:4px;}
  .redeem-btn{display:block;text-decoration:none;background:var(--green600);color:#fff;text-align:center;padding:15px;border-radius:14px;
    font-size:15px;font-weight:700;margin-bottom:12px;box-shadow:0 4px 12px rgba(1,175,162,0.26);}
  .log{background:var(--card);border-radius:14px;padding:2px 15px;border:1px solid var(--line);}
  .log-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;
    border-bottom:1px solid var(--line);font-size:12px;color:var(--ink2);}
  .log-row:last-child{border-bottom:none;}
  .log-row .id{font-family:monospace;color:var(--ink);}
  .log-row .new{background:var(--orange100);color:var(--orange700);font-size:10px;font-weight:700;
    padding:1px 6px;border-radius:6px;margin-left:6px;}

  /* ===== 衡量機制卡片 ===== */
  .spec{width:100%;max-width:980px;background:var(--card);border-radius:12px;padding:20px 24px;
    font-size:13px;color:var(--ink);line-height:1.8;border:1px solid var(--line);}
  .spec h2{font-size:16px;margin:0 0 4px;}
  .spec h3{font-size:14px;margin:16px 0 6px;color:var(--green700);}
  .spec code{background:#F6EDE0;padding:2px 6px;border-radius:4px;font-size:12px;}
  .spec table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;}
  .spec th,.spec td{border:1px solid var(--line);padding:6px 10px;text-align:left;}
  .spec th{background:#F9F0E3;}

  /* ===== 窄螢幕（390×844 等手機 viewport）：避免整頁水平溢位 ===== */
  @media (max-width:560px){
    body{padding:12px 6px; gap:40px 12px;}
    .frame{margin:0;}
    .phone{width:100%; max-width:375px;}
    /* B2：窄螢幕下捲軸使手機框縮到 363px，.redeem-rule 換成兩行；
       改為內容驅動高度，從結構上杜絕靜默裁切（min-height 保留原設計外觀） */
    #screen-b2 .scr{height:auto !important; min-height:429px;}
  }

  /* ===== NNW 活動小程式模擬器 ===== */
  :root{
    --sim-scale:1;
    --sim-side-pad:12px;
    --sim-pad-top:24px;
    --sim-pad-bottom:40px;
    --sim-green:#01AFA2;
    --sim-green-soft:#E6F7F6;
    --sim-orange:#FF9924;
    --sim-orange-soft:#FFF5E9;
    --sim-bg:#F5F5F5;
    --sim-surface:#FFFFFF;
    --sim-text:#262626;
    --sim-hint:#8C8C8C;
    --sim-error:#E83F19;
    --sim-error-soft:#FFECE8;
  }
  @supports (transform:scale(calc(1px / 1px))){
    :root{--sim-scale:min(1,calc((100vw - var(--sim-side-pad) * 2) / 390px),
      calc((100dvh - var(--sim-pad-top) - var(--sim-pad-bottom)) / 844px));}
  }
  html{background:#ECE9E4;}
  body{min-height:100vh;margin:0;padding:var(--sim-pad-top) var(--sim-side-pad) var(--sim-pad-bottom);display:block;
    background:#ECE9E4;color:var(--sim-text);overflow-x:hidden;
    font-family:"PingFang TC","Noto Sans TC","SF Pro",-apple-system,BlinkMacSystemFont,sans-serif;}
  html.mode-default,html.mode-default body{height:100dvh;min-height:0;overflow:hidden;}
  html.mode-compare,html.mode-qa{height:auto;overflow-x:hidden;overflow-y:auto;}
  html.mode-compare body,html.mode-qa body{height:auto;min-height:100vh;overflow-y:visible;}
  button,a{font:inherit;}
  button{border:0;}
  .sim-app{width:100%;}
  .single-host{display:flex;justify-content:center;width:100%;}
  .compare-grid{display:none;flex-wrap:wrap;gap:32px 24px;justify-content:center;align-items:flex-start;}
  html.mode-compare .single-host,
  html.mode-qa .single-host{display:none;}
  html.mode-compare .compare-grid,
  html.mode-qa .compare-grid{display:flex;}
  .compare-card{margin:0;}
  .compare-label{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--sim-text);text-align:center;}

  .sim-wrap{width:calc(390px * var(--sim-scale));height:calc(844px * var(--sim-scale));}
  .sim-shell{position:relative;width:390px;height:844px;transform:scale(var(--sim-scale));transform-origin:top left;
    display:grid;grid-template-rows:44px 44px minmax(0,1fr) 64px;background:var(--sim-bg);
    border:1px solid #D5D5D5;border-radius:44px;overflow:hidden;
    box-shadow:0 16px 40px rgba(38,38,38,.18);}
  .sim-shell[data-state="home"]{grid-template-rows:44px 0 minmax(0,1fr) 64px;}
  .sim-shell[data-state="detail"],.sim-shell[data-state="redeem"]{
    grid-template-rows:44px 44px minmax(0,1fr) 0;}
  .sim-shell[data-state="home"] .sim-topbar{visibility:hidden;pointer-events:none;overflow:hidden;}
  .sim-shell[data-state="detail"] .sim-tabbar,
  .sim-shell[data-state="redeem"] .sim-tabbar,
  .sim-shell[data-state="scan"] .sim-tabbar,
  .sim-shell[data-state="confirm"] .sim-tabbar,
  .sim-shell[data-state="success"] .sim-tabbar{display:none;}
  .sim-statusbar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;
    background:var(--sim-surface);font-size:14px;font-weight:600;color:var(--sim-text);}
  .sim-shell[data-state="home"] .sim-statusbar{background:#DDF4FA;}
  .status-signals{display:flex;align-items:center;gap:5px;}
  .signal-bars{width:16px;height:10px;display:flex;align-items:flex-end;gap:2px;}
  .signal-bars i{display:block;width:2px;background:var(--sim-text);border-radius:2px;}
  .signal-bars i:nth-child(1){height:4px}.signal-bars i:nth-child(2){height:6px}
  .signal-bars i:nth-child(3){height:8px}.signal-bars i:nth-child(4){height:10px}
  .battery{width:20px;height:10px;border:1.5px solid var(--sim-text);border-radius:2px;position:relative;}
  .battery::before{content:"";position:absolute;inset:2px;background:var(--sim-text);border-radius:1px;}
  .battery::after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:4px;background:var(--sim-text);}

  .sim-topbar{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;
    height:44px;padding:0;background:var(--sim-surface);border-bottom:1px solid #F0F0F0;}
  .sim-title{margin:0;padding:0 4px;font-size:17px;font-weight:600;text-align:center;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sim-title:focus{outline:none;}
  .top-actions{display:flex;align-items:center;justify-content:flex-end;gap:4px;}
  .icon-button,.role-switch{min-width:44px;min-height:44px;border-radius:10px;background:transparent;
    color:var(--sim-text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
  .icon-button img{width:24px;height:24px;display:block;}
  .role-switch{padding:0 8px;font-size:12px;font-weight:700;color:var(--sim-green);}
  .top-actions{visibility:hidden;pointer-events:none;}
  .icon-button:disabled{opacity:0;pointer-events:none;}

  .sim-scroll{min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
    scrollbar-width:none;background:var(--sim-bg);}
  .sim-scroll::-webkit-scrollbar{display:none;}
  .screen{min-height:100%;padding:16px;}
  .screen.flush{padding:0;}
  .section-pad{padding:16px;}
  .surface-card{background:var(--sim-surface);border:1px solid #E8E8E8;border-radius:16px;
    box-shadow:0 3px 12px rgba(38,38,38,.06);}
  .eyebrow{font-size:12px;font-weight:700;color:var(--sim-green);letter-spacing:.5px;}
  .screen h2{margin:6px 0 8px;font-size:22px;line-height:1.35;color:var(--sim-text);}
  .screen h3{margin:0 0 10px;font-size:15px;color:var(--sim-text);}
  .muted{color:var(--sim-hint);font-size:13px;line-height:1.65;}
  .demo-badge,.honesty-banner{display:inline-flex;align-items:center;min-height:28px;padding:4px 10px;
    border-radius:8px;font-size:12px;font-weight:700;}
  .demo-badge{color:var(--sim-orange);background:var(--sim-orange-soft);}
  .honesty-banner{display:flex;margin-bottom:12px;color:var(--sim-error);background:var(--sim-error-soft);}

  .official-home{min-height:100%;background:var(--sim-bg);}
  .official-home-scene{position:relative;height:330px;overflow:hidden;background-color:#DDF4FA;
    background-image:url("../assets/nnw-activity/app-ui/bg_default_floor.webp"),url("../assets/nnw-activity/app-ui/bg_default_sky.webp");
    background-repeat:no-repeat;background-position:center bottom,center top;
    background-size:100% 47%,100% 100%;}
  .home-nav{position:relative;z-index:2;height:44px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;}
  .home-nav strong{font-size:17px;font-weight:600;}
  .home-nav .home-points{padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.88);
    color:var(--sim-orange);font-size:12px;font-weight:700;}
  .home-tree{position:absolute;z-index:0;top:84px;left:50%;width:138px;height:auto;display:block;
    transform:translateX(-50%);object-fit:contain;}
  .shortcut-tray{position:absolute;z-index:1;left:16px;right:16px;bottom:8px;padding:12px 8px 10px;
    display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:rgba(255,255,255,.96);
    border:1px solid var(--sim-outline,#F0F0F0);border-radius:16px;box-shadow:0 4px 14px rgba(38,38,38,.10);}
  .shortcut-item{min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;
    color:var(--sim-text);font-size:10px;white-space:nowrap;}
  .shortcut-item img{width:38px;height:38px;object-fit:contain;}
  .shortcut-button{padding:0;background:transparent;cursor:pointer;}
  .shortcut-button:focus-visible{outline:3px solid rgba(1,175,162,.32);outline-offset:3px;border-radius:9px;}
  .home-content{padding:14px 16px 24px;}
  .carrier-card{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .carrier-card strong{display:block;margin-bottom:4px;font-size:16px;}
  .carrier-bars{display:flex;align-items:flex-end;gap:2px;height:40px;padding:7px 9px;border-radius:8px;background:#fff;}
  .carrier-bars i{display:block;width:2px;background:var(--sim-text);}
  .carrier-bars i:nth-child(odd){height:24px}.carrier-bars i:nth-child(even){height:31px}

        <select class="supply-select" data-supply-status>
          <option value="">洋蔥圈、炸雞球皆有供應</option>
          <option value="洋蔥圈">洋蔥圈售罄</option>
          <option value="炸雞球">炸雞球售罄</option>
        </select>
      </label>
      <div class="replacement-editor" data-replacement-editor hidden>
        <label class="replacement-label">同價替代品名稱
          <input class="replacement-input" data-replacement-name maxlength="20" autocomplete="off" placeholder="例如：薯條">
        </label>
        <label class="confirm-check"><input type="checkbox" data-same-price-confirm><span>店員已確認：這個替代品與售罄贈品價格相同</span></label>
      </div>
    </section>
    <label class="confirm-check"><input type="checkbox" data-policy-confirm><span>我已確認：本桌為內用、尚未領取本活動贈品，且沒有使用其他優惠活動。</span></label>
    <div class="redemption-review surface-card" data-redemption-review hidden>
      <strong>請再次核對</strong>
      <p>暖暖窩義式廚房・會員 …3F2C・本次核銷品項：<b data-review-gift></b>。確認後這份獎勵不可再次核銷。</p>
      <p data-review-substitute hidden>同價替代：原品項「<b data-review-original></b>」已售罄。</p>
      <p>店員已確認：限內用、本桌尚未領取，且未併用其他優惠。</p>
    </div>
    <button class="primary-button confirm-action" type="button" data-action="confirm-redeem" disabled aria-disabled="true">請先點選客人要的品項</button>
  </article>
</template>

<template id="screen-success-template">
  <article class="screen success-layout" data-screen="success">
    <div class="merchant-brand"><span class="merchant-logo">點到</span><span class="merchant-brand-copy"><strong>暖暖窩義式廚房</strong><small>活動核銷工作台</small></span><span class="merchant-session">店員已登入</span></div>
    <div class="success-card surface-card">
      <div class="success-mark" aria-hidden="true">完成</div>
      <h2>核銷成功</h2>
      <p>請為客人準備 <strong data-selected-choice>已選贈品</strong></p>
      <div class="receipt-card surface-card"><dl class="redemption-facts"><div><dt>核銷編號</dt><dd class="receipt-id" data-receipt-id>NNW-DEMO-0001</dd></div><div><dt>完成時間</dt><dd data-redeemed-at>--:--</dd></div><div><dt>本次核銷品項</dt><dd data-actual-gift>已選贈品</dd></div><div data-substitution-row hidden><dt>替代原品項</dt><dd><span data-original-gift></span>（售罄・同價替代）</dd></div><div><dt>活動規則</dt><dd>店員已確認</dd></div><div><dt>狀態</dt><dd>已核銷・不可重複</dd></div></dl></div>
      <div class="attribution-summary"><div><strong data-redemption-count>1</strong><span>本次展示核銷</span></div><div><strong data-unique-count>1</strong><span>已核銷資格數</span></div></div>
      <p class="muted">這代表「活動獎勵已在店內核銷」，不等於活動造成的新增客流；正式增量需用對照組驗證。</p>
      <div class="success-actions"><button class="primary-button" type="button" data-action="scan-next">回到核銷查詢</button><button class="secondary-button" type="button" data-action="return-to-rewards">回到顧客「我的獎勵」（展示用）</button></div>
    </div>
  </article>
</template>

<script>
  (function(){
    "use strict";

    var SCREEN_KEYS=["home","activities","detail","redeem","scan","confirm","success"];
    var TITLES={
      home:"發票載具",
      activities:"活動中心",
      detail:"活動詳情",
      redeem:"出示給店員",
      scan:"點到活動核銷",
      confirm:"確認核銷",
      success:"核銷結果"
    };
    var TRANSITIONS={
      home:["activities"],
      activities:["home","detail"],
      detail:["home","activities","redeem"],
      redeem:["detail","scan"],
      scan:["redeem","confirm"],
      confirm:["scan","success"],
      success:["scan","activities"]
    };
    var BACK_FALLBACK={
      home:"home",activities:"home",detail:"activities",redeem:"detail",
      scan:"redeem",confirm:"scan",success:"confirm"
    };
    var params=new URLSearchParams(location.search);
    var localQaHost=location.hostname==="127.0.0.1"||location.hostname==="localhost"||location.hostname==="::1";
    if(!localQaHost){
      ["owner","mode","qaScan","qaExpiry"].forEach(function(key){params.delete(key);});
    }
    var requested=params.get("screen");
    var mode=params.get("mode");
    if(params.get("owner")==="1") document.documentElement.classList.add("owner");
    var current=SCREEN_KEYS.indexOf(requested)>-1?requested:"home";
    var historyStack=[];
    var selectedGift="";
    var selectedOriginalGift="";
    var selectedFulfillmentType="base";
    var unavailableGift="";
    var replacementGift="";
    var samePriceConfirmed=false;
    var policyConfirmed=false;
    var merchantHandoffReady=false;
    var redeemDeadline=0;
    var redeemExpired=false;
    var countdownDuration=params.get("qaExpiry")==="1"?1:600;
    var countdownTimer=null;
    var demoToastTimer=null;
    var EXPECTED_QR_VALUE="NNW-DEMO-A7K2-3F2C";
    var DEMO_CREDENTIAL="A7K23F";
    var DEMO_CAMPAIGN_ID="NNW-2026-FALL";
    var DEMO_STORAGE_KEY="nnw-demo-redemptions-v25";
    var demoLedger=[];
    try{demoLedger=JSON.parse(sessionStorage.getItem(DEMO_STORAGE_KEY)||"[]");}catch(error){demoLedger=[];}
    if(!Array.isArray(demoLedger)) demoLedger=[];
    var activeReceipt=demoLedger.find(function(item){return item&&item.campaignId===DEMO_CAMPAIGN_ID;})||null;
    if(current==="scan"||current==="confirm"||current==="success") current="activities";
    var cameraStream=null;
    var cameraFrameId=null;
    var cameraTimeoutId=null;
    var cameraSession=0;
    var cameraDetector=null;
    var scanAccepted=false;
    var scanBusy=false;
    var lastScanAt=0;
    var singleHost=document.getElementById("single-host");
    var compareGrid=document.getElementById("compare-grid");
    var singleShell=null;

    if(mode!=="compare"&&mode!=="qa") mode="default";
    document.documentElement.classList.add("mode-"+mode);

    function fitSim(){
      var root=document.documentElement;
      var styles=getComputedStyle(root);
      var sidePad=parseFloat(styles.getPropertyValue("--sim-side-pad"))||0;
      var topPad=parseFloat(styles.getPropertyValue("--sim-pad-top"))||0;
      var bottomPad=parseFloat(styles.getPropertyValue("--sim-pad-bottom"))||0;
      var availWidth=root.clientWidth-sidePad*2;
      var availHeight=root.clientHeight-topPad-bottomPad;
      var s=Math.min(1,availWidth/390,availHeight/844);
      root.style.setProperty("--sim-scale",s);
    }
    fitSim(); addEventListener('resize', fitSim);

    var ownerReview=document.querySelector(".owner-review");
    if(ownerReview&&document.documentElement.classList.contains("owner")&&mode==="default"){
      var ownerToggle=ownerReview.querySelector(".owner-toggle");
      var ownerToggleState=ownerReview.querySelector(".owner-toggle-state");
      var ownerDesktop=matchMedia("(min-width:1100px)");
      var setOwnerOpen=function(open){
        ownerReview.classList.toggle("is-open",open);
        ownerToggle.setAttribute("aria-expanded",String(open));
        ownerToggleState.textContent=open?"收合":"展開";
      };
      setOwnerOpen(ownerDesktop.matches);
      ownerToggle.addEventListener("click",function(){
        setOwnerOpen(!ownerReview.classList.contains("is-open"));
      });
      ownerDesktop.addEventListener("change",function(event){setOwnerOpen(event.matches);});
    }

    function cloneTemplate(id){
      return document.getElementById(id).content.cloneNode(true);
    }

    function makeShell(state){
      var wrap=singleHost.firstElementChild.cloneNode(true);
      configureShell(wrap.querySelector(".sim-shell"),state);
      return wrap;
    }

    function stateTab(state){
      if(state==="home") return "home";
      if(state==="scan"||state==="confirm"||state==="success") return "merchant";
      return "activities";
    }

    function saveDemoLedger(){
      try{sessionStorage.setItem(DEMO_STORAGE_KEY,JSON.stringify(demoLedger));}catch(error){}
    }

    function demoCount(){return demoLedger.filter(function(item){return item&&item.status==="redeemed";}).length;}

    function paintDemoCounts(root){
      var count=demoCount();
      root.querySelectorAll("[data-redemption-count]").forEach(function(target){target.textContent=String(count);});
      root.querySelectorAll("[data-unique-count]").forEach(function(target){target.textContent=String(count);});
    }

    function resetSelectionData(options){
      selectedGift="";
      selectedOriginalGift="";
      selectedFulfillmentType="base";
      policyConfirmed=false;
      if(!(options&&options.keepSupply)){
        unavailableGift="";
        replacementGift="";
        samePriceConfirmed=false;
      }
    }

    function resetReviewState(){
      if(!singleShell) return;
      var review=singleShell.querySelector("[data-redemption-review]");
      if(review) review.hidden=true;
      var confirm=singleShell.querySelector(".confirm-action");
      if(confirm) confirm.dataset.action="confirm-redeem";
    }

    function updateConfirmAction(){
      if(!singleShell) return;
      var confirm=singleShell.querySelector(".confirm-action");
      if(!confirm) return;
      confirm.dataset.action="confirm-redeem";
      if(!selectedGift){
        confirm.disabled=true;
        confirm.setAttribute("aria-disabled","true");
        confirm.textContent="請先點選客人要的品項";
        return;
      }
      if(!policyConfirmed){
        confirm.disabled=true;
        confirm.setAttribute("aria-disabled","true");
        confirm.textContent="請先確認本桌活動規則";
        return;
      }
      confirm.disabled=false;
      confirm.setAttribute("aria-disabled","false");
      confirm.textContent="確認核銷「"+selectedGift+"」";
    }

    function clearRedemptionSelection(){
      selectedGift="";
      selectedOriginalGift="";
      selectedFulfillmentType="base";
      if(singleShell){
        singleShell.querySelectorAll(".gift-choice").forEach(function(choice){
          choice.classList.remove("is-selected");
          choice.setAttribute("aria-pressed","false");
        });
      }
      resetReviewState();
      updateConfirmAction();
    }

    function normalizedReplacementName(value){
      return String(value||"").trim().replace(/\s+/g," ").slice(0,20);
    }

    function updateReplacementChoice(){
      if(!singleShell) return;
      var input=singleShell.querySelector("[data-replacement-name]");
      var check=singleShell.querySelector("[data-same-price-confirm]");
      var choice=singleShell.querySelector("[data-replacement-choice]");
      if(!choice) return;
      replacementGift=normalizedReplacementName(input&&input.value);
      samePriceConfirmed=!!(check&&check.checked);
      var sameAsOriginal=!!replacementGift&&replacementGift.toLocaleLowerCase("zh-TW")===unavailableGift.toLocaleLowerCase("zh-TW");
      choice.hidden=!unavailableGift;
      choice.disabled=!unavailableGift||!replacementGift||sameAsOriginal||!samePriceConfirmed;
      choice.dataset.gift=replacementGift;
      choice.dataset.originalGift=unavailableGift;
      var name=choice.querySelector("[data-replacement-choice-name]");
      var note=choice.querySelector("[data-replacement-choice-note]");
      if(name) name.textContent=replacementGift||"同價替代品";
      if(note){
        if(!replacementGift) note.textContent="請先填寫實際品名";
        else if(sameAsOriginal) note.textContent="替代品不可與售罄原品相同";
        else if(!samePriceConfirmed) note.textContent="請先勾選店員已確認同價";
        else note.textContent="替代「"+unavailableGift+"」・可選擇核銷";
      }
    }

    function hydrateConfirmDraft(){
      if(!singleShell) return;
      var select=singleShell.querySelector("[data-supply-status]");
      if(select) select.value=unavailableGift;
      singleShell.querySelectorAll('.gift-choice[data-fulfillment-type="base"]').forEach(function(choice){
        var soldOut=choice.dataset.gift===unavailableGift;
        choice.disabled=soldOut;
        choice.classList.toggle("is-sold-out",soldOut);
        choice.setAttribute("aria-disabled",String(soldOut));
        var badge=choice.querySelector("[data-stock-badge]");
        if(badge) badge.hidden=!soldOut;
      });
      var editor=singleShell.querySelector("[data-replacement-editor]");
      if(editor) editor.hidden=!unavailableGift;
      var input=singleShell.querySelector("[data-replacement-name]");
      var priceCheck=singleShell.querySelector("[data-same-price-confirm]");
      var policyCheck=singleShell.querySelector("[data-policy-confirm]");
      if(input) input.value=replacementGift;
      if(priceCheck) priceCheck.checked=samePriceConfirmed;
      if(policyCheck) policyCheck.checked=policyConfirmed;
      updateReplacementChoice();
      singleShell.querySelectorAll(".gift-choice").forEach(function(choice){
        var selected=selectedFulfillmentType===(choice.dataset.fulfillmentType||"base")&&choice.dataset.gift===selectedGift&&!!selectedGift;
        choice.classList.toggle("is-selected",selected);
        choice.setAttribute("aria-pressed",String(selected));
      });
      updateConfirmAction();
    }

    function applySupplyState(){
      if(!singleShell) return;
      var select=singleShell.querySelector("[data-supply-status]");
      var nextUnavailable=select?select.value:"";
      clearRedemptionSelection();
      unavailableGift=nextUnavailable;
      replacementGift="";
      samePriceConfirmed=false;
      singleShell.querySelectorAll('.gift-choice[data-fulfillment-type="base"]').forEach(function(choice){
        var soldOut=choice.dataset.gift===unavailableGift;
        choice.disabled=soldOut;
        choice.classList.toggle("is-sold-out",soldOut);
        choice.setAttribute("aria-disabled",String(soldOut));
        var badge=choice.querySelector("[data-stock-badge]");
        if(badge) badge.hidden=!soldOut;
      });
      var editor=singleShell.querySelector("[data-replacement-editor]");
      if(editor) editor.hidden=!unavailableGift;
      var input=singleShell.querySelector("[data-replacement-name]");
      var check=singleShell.querySelector("[data-same-price-confirm]");
      if(input) input.value="";
      if(check) check.checked=false;
      updateReplacementChoice();
      announce(unavailableGift?"已標記「"+unavailableGift+"」售罄，請填寫同價替代品":"已恢復兩款贈品供應");
    }

    function paintRewardState(shell,state){
      if(state==="activities"){
        var active=shell.querySelector("[data-active-reward]");
        var used=shell.querySelector("[data-used-reward]");
        if(active) active.hidden=!!activeReceipt;
        if(used){
          used.hidden=!activeReceipt;
          if(activeReceipt){
            var summary=used.querySelector("[data-used-summary]");
            if(summary) summary.textContent=activeReceipt.redeemedAt+"・"+(activeReceipt.confirmedItem||activeReceipt.gift);
          }
        }
      }
      if(state==="redeem"){
        var code=shell.querySelector("[data-present-code]");
        var presentState=shell.querySelector("[data-present-state]");
        var openMerchant=shell.querySelector('[data-action="open-merchant-demo"]');
        if(code) code.textContent=activeReceipt?"已使用":DEMO_CREDENTIAL;
        if(activeReceipt){
          if(presentState){presentState.textContent="已於 "+activeReceipt.redeemedAt+" 核銷";presentState.dataset.state="used";}
          var countdown=shell.querySelector("[data-countdown]");
          if(countdown) countdown.hidden=true;
          if(openMerchant) openMerchant.textContent="查看點到核銷結果（展示用）";
        }
      }
      if(state==="success"&&activeReceipt){
        var confirmedItem=activeReceipt.confirmedItem||activeReceipt.gift;
        var choice=shell.querySelector("[data-selected-choice]");
        var receiptId=shell.querySelector("[data-receipt-id]");
        var redeemedAt=shell.querySelector("[data-redeemed-at]");
        var actualGift=shell.querySelector("[data-actual-gift]");
        var substitutionRow=shell.querySelector("[data-substitution-row]");
        var originalGift=shell.querySelector("[data-original-gift]");
        if(choice) choice.textContent=confirmedItem;
        if(receiptId) receiptId.textContent=activeReceipt.id;
        if(redeemedAt) redeemedAt.textContent=activeReceipt.redeemedAt;
        if(actualGift) actualGift.textContent=confirmedItem;
        if(substitutionRow) substitutionRow.hidden=activeReceipt.fulfillmentType!=="substitute";
        if(originalGift) originalGift.textContent=activeReceipt.requestedOriginalItem||"";
      }
      paintDemoCounts(shell);
    }

    function configureShell(shell,state){
      var scroll=shell.querySelector(".sim-scroll");
      scroll.replaceChildren(cloneTemplate("screen-"+state+"-template"));
      scroll.scrollTop=0;
      shell.dataset.state=state;
      shell.querySelector(".sim-title").textContent=TITLES[state];
      var back=shell.querySelector(".back-button");
      back.disabled=state==="home"||state==="activities";
      var staff=state==="scan"||state==="confirm"||state==="success";
      var role=shell.querySelector(".role-switch");
      role.textContent=staff?"切顧客":"切店員";
      role.setAttribute("aria-label",staff?"切換至顧客視角":"切換至店員視角");
      var activeTab=stateTab(state);
      shell.querySelectorAll(".tab-button").forEach(function(tab){
        var active=tab.dataset.tab===activeTab;
        var icon=tab.querySelector("img");
        if(active) tab.setAttribute("aria-current","page");
        else tab.removeAttribute("aria-current");
        icon.src=active?icon.dataset.activeSrc:icon.dataset.defaultSrc;
      });
      paintRewardState(shell,state);
      if(state==="confirm"&&shell===singleShell){
        hydrateConfirmDraft();
      }
    }

    function announce(message){
      if(!singleShell) return;
      var live=singleShell.querySelector(".live-region");
      live.textContent="";
      setTimeout(function(){live.textContent=message;},0);
      var toast=singleShell.querySelector("[data-demo-toast]");
      if(toast){
        if(demoToastTimer!==null) clearTimeout(demoToastTimer);
        toast.textContent=message;
        toast.hidden=false;
        demoToastTimer=setTimeout(function(){toast.hidden=true;},2200);
      }
    }

    function scannerParts(){
      return {
        stage:singleShell&&singleShell.querySelector("[data-camera-stage]"),
        video:singleShell&&singleShell.querySelector("[data-camera-video]"),
        canvas:singleShell&&singleShell.querySelector("[data-camera-canvas]"),
        status:singleShell&&singleShell.querySelector("[data-scanner-status]"),
        start:singleShell&&singleShell.querySelector('[data-action="start-camera-scan"]'),
        stop:singleShell&&singleShell.querySelector('[data-action="stop-camera-scan"]')
      };
    }

    function setScannerStatus(message,state){
      var status=scannerParts().status;
      if(!status) return;
      status.textContent=message;
      if(state) status.dataset.state=state;
      else status.removeAttribute("data-state");
    }

    function stopScanner(options){
      cameraSession+=1;
      scanBusy=false;
      scanAccepted=false;
      cameraDetector=null;
      if(cameraFrameId!==null){cancelAnimationFrame(cameraFrameId);cameraFrameId=null;}
      if(cameraTimeoutId!==null){clearTimeout(cameraTimeoutId);cameraTimeoutId=null;}
      if(cameraStream){
        cameraStream.getTracks().forEach(function(track){track.stop();});
        cameraStream=null;
      }
      var parts=scannerParts();
      if(parts.video){
        try{parts.video.pause();}catch(error){}
        parts.video.srcObject=null;
      }
      if(parts.stage) parts.stage.classList.remove("is-active");
      if(parts.start){
        parts.start.disabled=false;
        parts.start.classList.remove("is-loading");
        parts.start.textContent="開啟相機掃描";
        parts.start.hidden=false;
      }
      if(parts.stop) parts.stop.hidden=true;
      if(!(options&&options.preserveStatus)) setScannerStatus("點擊下方按鈕後，允許使用後鏡頭。","");
    }

    function stopAsync(){
      if(countdownTimer!==null){clearInterval(countdownTimer);countdownTimer=null;}
      stopScanner();
    }

    function redeemCodeIsValid(){
      return !redeemExpired&&redeemDeadline>Date.now();
    }

    function markRedeemExpired(){
      if(activeReceipt) return;
      redeemExpired=true;
      if(countdownTimer!==null){clearInterval(countdownTimer);countdownTimer=null;}
      var target=singleShell&&singleShell.querySelector("[data-countdown]");
      if(target) target.textContent="出示碼已失效";
      var presentState=singleShell&&singleShell.querySelector("[data-present-state]");
      if(presentState){presentState.textContent="出示碼已失效";presentState.dataset.state="expired";}
      var scanButton=singleShell&&singleShell.querySelector('[data-action="open-merchant-demo"]');
      if(scanButton){
        scanButton.disabled=false;
        scanButton.dataset.action="renew-redeem";
        scanButton.textContent="重新產生出示憑證";
      }
      announce("出示碼已失效，請重新產生");
    }

    function startCountdown(){
      if(activeReceipt) return;
      if(!redeemDeadline){
        redeemDeadline=Date.now()+countdownDuration*1000;
        redeemExpired=false;
      }
      function paint(){
        var target=singleShell&&singleShell.querySelector("[data-countdown]");
        if(!target) return false;
        var seconds=Math.max(0,Math.ceil((redeemDeadline-Date.now())/1000));
        if(seconds<=0){markRedeemExpired();return false;}
        var minutes=Math.floor(seconds/60);
        var rest=String(seconds%60).padStart(2,"0");
        target.textContent=String(minutes).padStart(2,"0")+":"+rest+" 後失效";
        return true;
      }
      if(paint()) countdownTimer=setInterval(paint,250);
    }

    function issueRedeemCode(){
      if(activeReceipt){
        go("redeem","這份獎勵已完成核銷");
        return;
      }
      redeemDeadline=Date.now()+countdownDuration*1000;
      redeemExpired=false;
      resetSelectionData({keepSupply:true});
      go("redeem","已產生到店出示憑證，倒數開始");
    }

    function ensureRedeemWindow(){
      if(!redeemDeadline&&!redeemExpired){
        redeemDeadline=Date.now()+countdownDuration*1000;
      }
      return redeemCodeIsValid();
    }

    function updateQa(){
      var target=document.getElementById("qa-state");
      if(target) target.textContent="目前 state："+current+"\n可用轉場："+TRANSITIONS[current].join("、");
    }

    function renderSingle(next,message,pushHistory){
      if(SCREEN_KEYS.indexOf(next)===-1) next="home";
      var merchantState=next==="scan"||next==="confirm"||next==="success";
      if(merchantState&&!merchantHandoffReady){
        next="activities";
        message="請先從顧客的出示憑證進入點到店員端展示";
        pushHistory=false;
        merchantState=false;
      }
      if(next==="confirm"&&activeReceipt){
        next="success";
        message="這份獎勵已核銷，已開啟原核銷結果";
        merchantState=true;
      }
      var leavingMerchant=(current==="scan"||current==="confirm"||current==="success")&&!merchantState;
      if(leavingMerchant) merchantHandoffReady=false;
      stopAsync();
      if(pushHistory&&next!==current) historyStack.push(current);
      if(next==="success"&&activeReceipt) historyStack=[];
      current=next;
      configureShell(singleShell,current);
      updateQa();
      if((current==="redeem"||current==="confirm")&&!activeReceipt) startCountdown();
      if(message){
        announce(message);
        var heading=singleShell.querySelector(".sim-title");
        if(heading){
          heading.setAttribute("tabindex","-1");
          requestAnimationFrame(function(){heading.focus({preventScroll:true});});
        }
      }
    }

    function go(next,message){
      renderSingle(next,message,true);
    }

    function goBack(){
      var next=current==="success"?"scan":(historyStack.length?historyStack.pop():BACK_FALLBACK[current]);
      renderSingle(next,"已返回「"+TITLES[next]+"」",false);
    }

    function resetFlow(){
      resetSelectionData();
      redeemDeadline=0;
      redeemExpired=false;
      demoLedger=[];
      activeReceipt=null;
      merchantHandoffReady=false;
      try{sessionStorage.removeItem(DEMO_STORAGE_KEY);}catch(error){}
      historyStack=[];
      renderSingle("home","流程已重設，回到首頁",false);
    }

    function scanNext(){
      resetSelectionData({keepSupply:true});
      historyStack=[];
      renderSingle("scan","已回到核銷查詢；再次輸入同一出示碼會顯示原核銷結果",false);
    }

    function lookupCredential(){
      if(!merchantHandoffReady){
        renderSingle("activities","請先從顧客的出示憑證進入點到店員端展示",false);
        return;
      }
      var input=singleShell&&singleShell.querySelector("[data-code-input]");
      var status=singleShell&&singleShell.querySelector("[data-lookup-status]");
      if(!input||!status) return;
      var value=input.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);
      input.value=value;
      status.removeAttribute("data-state");
      if(value.length!==6){
        status.textContent="請輸入完整 6 位出示碼。";
        status.dataset.state="error";
        input.focus();
        return;
      }
      if(value!==DEMO_CREDENTIAL){
        status.textContent="找不到這個獎勵，請和顧客確認出示碼。";
        status.dataset.state="error";
        input.select();
        return;
      }
      if(activeReceipt){
        status.textContent="此獎勵已核銷，正在開啟原核銷結果。";
        status.dataset.state="success";
        renderSingle("success","重複查詢已阻擋；核銷筆數沒有增加",true);
        return;
      }
      if(!redeemCodeIsValid()){
        status.textContent="這組出示碼已過期，請顧客重新開啟出示憑證。";
        status.dataset.state="error";
        return;
      }
      resetSelectionData({keepSupply:true});
      status.textContent="資格有效，正在開啟核銷確認。";
      status.dataset.state="success";
      go("confirm","獎勵資格有效，請選擇贈品並再次確認");
    }

    function chooseGift(button){
      if(button.disabled) return;
      if(!redeemCodeIsValid()){
        renderSingle("redeem","出示碼已失效，請重新產生",false);
        return;
      }
      var fulfillmentType=button.dataset.fulfillmentType||"base";
      if(fulfillmentType==="substitute"&&(!replacementGift||!samePriceConfirmed)) return;
      selectedGift=button.dataset.gift;
      selectedOriginalGift=button.dataset.originalGift||selectedGift;
      selectedFulfillmentType=fulfillmentType;
      singleShell.querySelectorAll(".gift-choice").forEach(function(choice){
        var selected=choice===button;
        choice.classList.toggle("is-selected",selected);
        choice.setAttribute("aria-pressed",String(selected));
      });
      resetReviewState();
      updateConfirmAction();
      announce("已選擇"+selectedGift+(policyConfirmed?"，可以確認核銷":"，請再確認本桌活動規則"));
    }

    function scannerErrorMessage(error){
      if(!window.isSecureContext) return "相機只能在 HTTPS 安全連線中使用。";
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return "這個瀏覽器不支援相機掃描，請改用最新版 Safari 或 Chrome。";
      if(error&&error.name==="NotAllowedError") return "相機權限未開啟，請在瀏覽器網站設定中允許相機後再重試。";
      if(error&&error.name==="NotFoundError") return "找不到可用相機，請確認裝置有鏡頭。";
      if(error&&error.name==="NotReadableError") return "相機目前被其他程式使用，請關閉其他相機程式後重試。";
      if(error&&error.name==="AbortError") return "相機啟動被中斷，請重新嘗試。";
      return "相機無法啟動，請檢查權限後重新嘗試。";
    }

    async function selectCameraDetector(){
      if(!("BarcodeDetector" in window)||typeof BarcodeDetector.getSupportedFormats!=="function") return null;
      try{
        var formats=await BarcodeDetector.getSupportedFormats();
        if(formats.indexOf("qr_code")>-1) return new BarcodeDetector({formats:["qr_code"]});
      }catch(error){}
      return null;
    }

    function decodeCanvas(canvas){
      if(typeof window.jsQR!=="function") throw new Error("jsQR-unavailable");
      var context=canvas.getContext("2d",{willReadFrequently:true});
      var frame=context.getImageData(0,0,canvas.width,canvas.height);
      return window.jsQR(frame.data,canvas.width,canvas.height,{inversionAttempts:"attemptBoth"});
    }

    function decodeVideoFrame(video,canvas){
      var width=video.videoWidth;
      var height=video.videoHeight;
      if(!width||!height) return null;
      var scale=Math.min(1,720/width);
      canvas.width=Math.max(1,Math.round(width*scale));
      canvas.height=Math.max(1,Math.round(height*scale));
      canvas.getContext("2d",{willReadFrequently:true}).drawImage(video,0,0,canvas.width,canvas.height);
      return decodeCanvas(canvas);
    }

    function acceptDecodedValue(rawValue,session){
      if(session!==cameraSession||scanAccepted) return;
      if(rawValue!==EXPECTED_QR_VALUE){
        setScannerStatus("這不是暖暖窩活動兌換碼，請換一張 QR Code。","error");
        return;
      }
      if(!redeemCodeIsValid()){
        stopScanner({preserveStatus:true});
        renderSingle("redeem","兌換碼已失效，請重新產生",false);
        return;
      }
      scanAccepted=true;
      resetSelectionData({keepSupply:true});
      setScannerStatus("兌換碼讀取成功，正在開啟店員確認。","success");
      stopScanner({preserveStatus:true});
      go("confirm","兌換碼已讀取，請選擇贈品");
    }

    async function scanCameraFrame(session){
      if(session!==cameraSession||scanAccepted||!cameraStream) return;
      cameraFrameId=requestAnimationFrame(function(){scanCameraFrame(session);});
      var now=performance.now();
      if(scanBusy||now-lastScanAt<140) return;
      var parts=scannerParts();
      if(!parts.video||parts.video.readyState<2) return;
      lastScanAt=now;
      scanBusy=true;
      var detectorForFrame=cameraDetector;
      try{
        var rawValue="";
        if(detectorForFrame){
          var results=await detectorForFrame.detect(parts.video);
          if(session!==cameraSession) return;
          if(results&&results.length){
            var values=results.map(function(result){return result.rawValue||"";});
            rawValue=values.indexOf(EXPECTED_QR_VALUE)>-1?EXPECTED_QR_VALUE:values[0];
          }
        }else{
          var decoded=decodeVideoFrame(parts.video,parts.canvas);
          if(decoded) rawValue=decoded.data||"";
        }
        if(session!==cameraSession) return;
        if(rawValue) acceptDecodedValue(rawValue,session);
      }catch(error){
        if(session!==cameraSession) return;
        if(detectorForFrame&&cameraDetector===detectorForFrame){
          cameraDetector=null;
          setScannerStatus("已切換到相容解碼模式，請繼續對準 QR Code。","");
        }else{
          stopScanner({preserveStatus:true});
          setScannerStatus(error&&error.message==="jsQR-unavailable"?
            "QR 解碼器載入失敗，請重新整理頁面。":"掃描發生錯誤，請重新嘗試。","error");
        }
      }finally{
        if(session===cameraSession) scanBusy=false;
      }
    }

    function decodeFixture(session){
      var parts=scannerParts();
      var image=new Image();
      image.onload=function(){
        if(session!==cameraSession) return;
        parts.canvas.width=image.naturalWidth;
        parts.canvas.height=image.naturalHeight;
        parts.canvas.getContext("2d",{willReadFrequently:true}).drawImage(image,0,0);
        var decoded=decodeCanvas(parts.canvas);
        acceptDecodedValue(decoded&&decoded.data||"",session);
      };
      image.onerror=function(){
        if(session!==cameraSession) return;
        stopScanner({preserveStatus:true});
        setScannerStatus("測試兌換碼圖片無法載入。","error");
      };
      image.src="../assets/nnw-activity/redeem-qr.png";
    }

    async function startCameraScan(button){
      if(!ensureRedeemWindow()){
        renderSingle("redeem","兌換碼已失效，請重新產生",false);
        return;
      }
      stopScanner();
      var session=cameraSession;
      var parts=scannerParts();
      button=parts.start||button;
      button.disabled=true;
      button.classList.add("is-loading");
      button.textContent="等待相機權限";
      setScannerStatus("正在等待相機權限…","");
      if(parts.stop){parts.stop.hidden=false;parts.stop.textContent="取消";}
      cameraTimeoutId=setTimeout(function(){
        if(session!==cameraSession) return;
        stopScanner({preserveStatus:true});
        setScannerStatus("仍在等待相機權限，請檢查瀏覽器設定後重試。","error");
      },10000);
      if(params.get("qaScan")==="fixture"){
        decodeFixture(session);
        return;
      }
      if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
        stopScanner({preserveStatus:true});
        setScannerStatus(scannerErrorMessage(),"error");
        return;
      }
      try{
        var stream;
        try{
          stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{
            facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}
          }});
        }catch(error){
          if(error&&error.name==="OverconstrainedError"){
            stream=await navigator.mediaDevices.getUserMedia({audio:false,video:true});
          }else throw error;
        }
        if(session!==cameraSession){
          stream.getTracks().forEach(function(track){track.stop();});
          return;
        }
        cameraStream=stream;
        parts.video.srcObject=stream;
        await parts.video.play();
        if(session!==cameraSession){
          stream.getTracks().forEach(function(track){track.stop();});
          if(cameraStream===stream) cameraStream=null;
          return;
        }
        var selectedDetector=await selectCameraDetector();
        if(session!==cameraSession){
          stream.getTracks().forEach(function(track){track.stop();});
          if(cameraStream===stream) cameraStream=null;
          return;
        }
        cameraDetector=selectedDetector;
        if(cameraTimeoutId!==null){clearTimeout(cameraTimeoutId);cameraTimeoutId=null;}
        parts.stage.classList.add("is-active");
        parts.start.hidden=true;
        parts.start.classList.remove("is-loading");
        parts.stop.hidden=false;
        parts.stop.textContent="停止掃描";
        setScannerStatus("相機已開啟，請將 QR Code 放進方框內。","");
        cameraTimeoutId=setTimeout(function(){
          if(session!==cameraSession) return;
          stopScanner({preserveStatus:true});
          setScannerStatus("20 秒內沒有讀到兌換碼，請重新掃描。","error");
        },20000);
        scanCameraFrame(session);
      }catch(error){
        if(session!==cameraSession) return;
        stopScanner({preserveStatus:true});
        setScannerStatus(scannerErrorMessage(error),"error");
      }
    }

    function handleAction(event){
      var control=event.target.closest("[data-action]");
      if(!control||control.disabled) return;
      var action=control.dataset.action;
      if(action==="back") goBack();
      else if(action==="reset"||action==="restart") resetFlow();
      else if(action==="scan-next") scanNext();
      else if(action==="open-activities"||action==="go-activities") go("activities","已開啟活動中心");
      else if(action==="open-detail"){
        go("detail","已開啟暖暖窩活動詳情");
      }
      else if(action==="open-redeem"||action==="renew-redeem") issueRedeemCode();
      else if(action==="open-merchant-demo"){
        if(activeReceipt){
          merchantHandoffReady=true;
          go("success","已開啟原核銷結果；核銷筆數沒有增加");
        }
        else if(redeemCodeIsValid()){
          merchantHandoffReady=true;
          go("scan","已開啟點到店員端展示");
        }
        else markRedeemExpired();
      }
      else if(action==="go-home") go("home","已回到首頁");
      else if(action==="switch-role") go(current==="scan"||current==="confirm"||current==="success"?"redeem":"activities","已切換展示視角");
      else if(action==="return-to-rewards") go("activities","已回到顧客的「我的獎勵」");
      else if(action==="reward-summary") announce(activeReceipt?"目前有 1 筆已使用獎勵紀錄":"目前有 1 個可使用獎勵");
      else if(action==="start-camera-scan") startCameraScan(control);
      else if(action==="stop-camera-scan"){
        stopScanner({preserveStatus:true});
        setScannerStatus("掃描已停止；需要時可重新開啟相機。","");
      }
      else if(action==="select-gift") chooseGift(control);
      else if(action==="confirm-redeem"){
        if(!selectedGift||!policyConfirmed) return;
        if(selectedFulfillmentType==="substitute"&&(!samePriceConfirmed||!replacementGift)) return;
        if(!redeemCodeIsValid()){
          renderSingle("redeem","出示碼已失效，請重新產生",false);
          return;
        }
        var review=singleShell.querySelector("[data-redemption-review]");
        if(review){
          review.hidden=false;
          review.querySelector("[data-review-gift]").textContent=selectedGift;
          var substitute=review.querySelector("[data-review-substitute]");
          var original=review.querySelector("[data-review-original]");
          if(substitute) substitute.hidden=selectedFulfillmentType!=="substitute";
          if(original) original.textContent=selectedOriginalGift;
        }
        control.dataset.action="finalize-redeem";
        control.textContent="再次確認核銷「"+selectedGift+"」";
        control.disabled=true;
        control.setAttribute("aria-disabled","true");
        setTimeout(function(){
          if(current==="confirm"&&control.isConnected&&control.dataset.action==="finalize-redeem"){
            control.disabled=false;
            control.setAttribute("aria-disabled","false");
          }
        },700);
        announce("請再次核對會員與贈品後完成核銷");
      }
      else if(action==="finalize-redeem"){
        if(!selectedGift||!policyConfirmed) return;
        if(selectedFulfillmentType==="substitute"&&(!samePriceConfirmed||!replacementGift)) return;
        if(activeReceipt){
          go("success","這份獎勵已核銷；核銷筆數沒有增加");
          return;
        }
        if(!redeemCodeIsValid()){
          renderSingle("redeem","出示碼已失效，請重新產生",false);
          return;
        }
        control.disabled=true;
        redeemExpired=true;
        var now=new Date();
        var redeemedAt=now.toLocaleString("zh-TW",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
        activeReceipt={
          id:"NNW-DEMO-"+String(demoLedger.length+1).padStart(4,"0"),
          campaignId:DEMO_CAMPAIGN_ID,
          gift:selectedGift,
          requestedOriginalItem:selectedOriginalGift,
          confirmedItem:selectedGift,
          fulfillmentType:selectedFulfillmentType,
          substitutionReason:selectedFulfillmentType==="substitute"?"sold_out":null,
          samePriceConfirmed:selectedFulfillmentType==="substitute"&&samePriceConfirmed,
          policyConfirmed:policyConfirmed,
          redeemedAt:redeemedAt,
          status:"redeemed"
        };
        demoLedger.push(activeReceipt);
        saveDemoLedger();
        go("success","核銷成功；本次展示核銷數已增加 1 筆");
      }
      else if(action==="unavailable") announce("此功能尚未開放");
    }

    function renderCompare(){
      SCREEN_KEYS.forEach(function(state){
        var card=document.createElement("section");
        card.className="compare-card";
        var label=document.createElement("h2");
        label.className="compare-label";
        label.textContent=state+" · "+TITLES[state];
        var wrap=makeShell(state);
        wrap.querySelector(".sim-shell").inert=true;
        card.append(label,wrap);
        compareGrid.appendChild(card);
      });
      updateQa();
    }

    if(mode==="compare"||mode==="qa"){
      renderCompare();
    }else{
      var wrap=singleHost.firstElementChild;
      singleShell=wrap.querySelector(".sim-shell");
      configureShell(singleShell,current);
      singleHost.addEventListener("click",handleAction);
      singleHost.addEventListener("submit",function(event){
        if(!event.target.matches("[data-merchant-code-form]")) return;
        event.preventDefault();
        lookupCredential();
      });
      singleHost.addEventListener("input",function(event){
        if(event.target.matches("[data-code-input]")){
          event.target.value=event.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);
          return;
        }
        if(event.target.matches("[data-replacement-name]")){
          if(selectedFulfillmentType==="substitute") clearRedemptionSelection();
          var priceCheck=singleShell.querySelector("[data-same-price-confirm]");
          if(priceCheck) priceCheck.checked=false;
          samePriceConfirmed=false;
          resetReviewState();
          updateReplacementChoice();
          updateConfirmAction();
        }
      });
      singleHost.addEventListener("change",function(event){
        if(event.target.matches("[data-supply-status]")){
          applySupplyState();
          return;
        }
        if(event.target.matches("[data-same-price-confirm]")){
          if(selectedFulfillmentType==="substitute") clearRedemptionSelection();
          resetReviewState();
          updateReplacementChoice();
          updateConfirmAction();
          return;
        }
        if(event.target.matches("[data-policy-confirm]")){
          policyConfirmed=event.target.checked;
          resetReviewState();
          updateConfirmAction();
          announce(policyConfirmed?"已確認本桌活動規則":"已取消本桌活動規則確認");
        }
      });
      if(current==="redeem"||current==="confirm") startCountdown();
      updateQa();
    }
    addEventListener("pagehide",function(){
      stopScanner({preserveStatus:true});
    });
    document.addEventListener("visibilitychange",function(){
      if(document.hidden&&cameraStream){
        stopScanner({preserveStatus:true});
        setScannerStatus("頁面進入背景，相機已停止；請重新開啟掃描。","");
      }
    });
    fitSim();
  })();
</script>
