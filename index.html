<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地生活圈 × 發票載具｜Demo 總覽</title>
<style>
/* ══════════════════════════════════════════════════════════════
   Design Token —— 單一 :root，system 層不得手改（design-system-governance spec）
   本頁零外連：字體、樣式、資料全部內嵌。WebView 離線開啟不白屏。
   ══════════════════════════════════════════════════════════════ */
:root{
  /* system · 色彩 */
  /* c-brand 與 c-ink-3 都刻意壓深過一次：原值 #01805C / #8A8F98 在
     淺底上量到 4.48 與 3.25，未達 WCAG AA 4.5:1。弱化的文字仍然要讀得到。 */
  --c-brand:#016B4D; --c-brand-weak:#E6F7F6; --c-brand-line:#01AFA2;
  --c-ink:#1A1F26; --c-ink-2:#5A6472; --c-ink-3:#6B7280;
  --c-bg:#F5F7F7; --c-surface:#FFFFFF; --c-line:#E1E6EC;
  --c-warn-bg:#FFF8E8; --c-warn-line:#F2E3B8; --c-warn-ink:#7A5D14;
  --c-block-bg:#FDECEC; --c-block-line:#F5C4C4; --c-block-ink:#9B2020;
  --c-focus:#0B63CE;
  /* system · 間距（4/8 階） */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px;
  /* system · 字級 */
  --f-xs:11.5px; --f-sm:12.5px; --f-md:14px; --f-lg:16px; --f-xl:20px; --f-2xl:26px;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 12px rgba(16,24,40,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:var(--c-bg); color:var(--c-ink); line-height:1.7;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1080px;margin:0 auto;padding:var(--s-6) var(--s-4) var(--s-7)}
a{color:inherit}
:focus-visible{outline:3px solid var(--c-focus);outline-offset:2px;border-radius:var(--r-sm)}

/* ── 頁首 ── */
header{border-bottom:3px solid var(--c-brand-line);padding-bottom:var(--s-4);margin-bottom:var(--s-5)}
h1{font-size:var(--f-2xl);font-weight:800;letter-spacing:.01em;line-height:1.35}
.sub{font-size:var(--f-md);color:var(--c-ink-2);margin-top:var(--s-2);max-width:62ch}
.gate{
  display:inline-flex;align-items:center;gap:var(--s-2);margin-top:var(--s-3);
  background:var(--c-warn-bg);border:1px solid var(--c-warn-line);color:var(--c-warn-ink);
  font-size:var(--f-sm);font-weight:700;border-radius:99px;padding:var(--s-1) var(--s-3);
}

/* ── 篩選 ── */
.filters{
  background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-lg);
  padding:var(--s-4);margin-bottom:var(--s-4);box-shadow:var(--shadow);
}
.frow{display:flex;flex-wrap:wrap;gap:var(--s-3);align-items:flex-end}
.fgroup{display:flex;flex-direction:column;gap:var(--s-1);min-width:0}
.fgroup label{font-size:var(--f-xs);font-weight:700;color:var(--c-ink-2);letter-spacing:.04em}
select,input[type=search]{
  font:inherit;font-size:var(--f-sm);color:var(--c-ink);background:var(--c-surface);
  border:1px solid var(--c-line);border-radius:var(--r-sm);padding:7px 10px;min-height:38px;
}
input[type=search]{min-width:190px}
.fcount{margin-left:auto;font-size:var(--f-sm);color:var(--c-ink-2);white-space:nowrap;padding-bottom:8px}
.fcount b{color:var(--c-ink);font-variant-numeric:tabular-nums}
.btn-reset{
  font:inherit;font-size:var(--f-sm);background:none;border:1px solid var(--c-line);
  border-radius:var(--r-sm);padding:8px 12px;cursor:pointer;color:var(--c-ink-2);min-height:38px;
}
.btn-reset:hover{border-color:var(--c-brand-line);color:var(--c-brand)}

/* ── 狀態圖例 ── */
.legend{
  display:flex;flex-wrap:wrap;gap:var(--s-2) var(--s-4);
  padding:var(--s-3) var(--s-4);background:var(--c-surface);
  border:1px solid var(--c-line);border-radius:var(--r-lg);margin-bottom:var(--s-5);
  font-size:var(--f-sm);color:var(--c-ink-2);
}
.legend .li{display:flex;align-items:center;gap:6px}

/* 狀態徽章：形狀＋文字雙編碼，不靠顏色單獨表意 */
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:var(--f-xs);font-weight:800;
  border-radius:var(--r-sm);padding:2px 8px;border:1px solid transparent;white-space:nowrap;
}
.badge .gl{font-size:10px;line-height:1}
.b-available   {background:var(--c-brand-weak);color:var(--c-brand);   border-color:#B9E5DE}
.b-demo-mocked {background:#EEF2FF;            color:#3B4A9E;          border-color:#CBD5F5}
.b-in-development{background:#FFF1E4;          color:#8A4B10;          border-color:#F3D4B4}
.b-planned     {background:#F1F3F6;            color:#4E5866;          border-color:#DCE1E8}
.b-out-of-scope{background:#F1F3F6;            color:#5A6472;          border-color:#DCE1E8}

/* ── 區塊 ── */
h2{
  font-size:var(--f-md);font-weight:800;color:var(--c-brand);letter-spacing:.1em;
  margin:var(--s-6) 0 var(--s-3);display:flex;align-items:center;gap:var(--s-2);
}
h2::before{content:"";width:4px;height:15px;background:var(--c-brand-line);border-radius:2px}
h2 .n{font-size:var(--f-xs);color:var(--c-ink-3);font-weight:600;letter-spacing:0}

/* ── 卡片 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--s-3);align-items:stretch}
.card{
  background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-md);
  padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-2);box-shadow:var(--shadow);
}
.card h3{font-size:var(--f-lg);font-weight:700;line-height:1.4}
.card .desc{font-size:var(--f-sm);color:var(--c-ink-2);flex:1}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{
  font-size:var(--f-xs);color:var(--c-ink-2);background:#F4F6F8;
  border-radius:var(--r-sm);padding:2px 7px;white-space:nowrap;
}
.chip b{color:var(--c-ink)}
.note{
  font-size:var(--f-xs);line-height:1.65;color:var(--c-warn-ink);
  background:var(--c-warn-bg);border:1px solid var(--c-warn-line);
  border-radius:var(--r-sm);padding:6px 9px;
}
.note.blocked{color:var(--c-block-ink);background:var(--c-block-bg);border-color:var(--c-block-line)}
.actions{display:flex;flex-wrap:wrap;gap:var(--s-2);margin-top:var(--s-1)}
.act{
  font-size:var(--f-sm);font-weight:700;text-decoration:none;border-radius:var(--r-sm);
  padding:7px 12px;border:1px solid var(--c-line);color:var(--c-ink);background:var(--c-surface);
  display:inline-flex;align-items:center;gap:5px;min-height:38px;
}
.act:hover{border-color:var(--c-brand-line);color:var(--c-brand);background:var(--c-brand-weak)}
.act.primary{background:var(--c-brand);color:#fff;border-color:var(--c-brand)}
.act.primary:hover{background:#01523B;color:#fff}
.act.muted{color:var(--c-ink-3);border-style:dashed;cursor:not-allowed}
.act.muted:hover{border-color:var(--c-line);color:var(--c-ink-3);background:var(--c-surface)}
.verified{font-size:var(--f-xs);color:var(--c-ink-3);margin-top:2px}

.empty{
  border:1px dashed var(--c-line);border-radius:var(--r-md);padding:var(--s-6);
  text-align:center;color:var(--c-ink-2);font-size:var(--f-md);background:var(--c-surface);
}
footer{margin-top:var(--s-7);padding-top:var(--s-4);border-top:1px solid var(--c-line);
  font-size:var(--f-sm);color:var(--c-ink-3);line-height:1.9}
footer a{color:var(--c-brand)}

@media (max-width:520px){
  .wrap{padding:var(--s-4) var(--s-3) var(--s-6)}
  h1{font-size:var(--f-xl)}
  .grid{grid-template-columns:1fr}
  .fcount{margin-left:0;width:100%;padding-bottom:0}
  input[type=search]{min-width:0;width:100%}
  .fgroup{flex:1 1 46%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('registry-data').textContent);
  var META = DATA._meta || {}, CAPS = DATA.capabilities || [];
  var VOCAB = META.statusVocabulary || {};
  /* 狀態的形狀編碼——色覺障礙者只靠顏色分不出來，所以形狀＋文字雙保險 */
  var GLYPH = {
    'available':'●', 'demo-mocked':'◐', 'in-development':'◔',
    'planned':'○', 'out-of-scope':'✕'
  };
  var SIDE_ZH = { user:'User 使用者端', biz:'Biz 商家端', shared:'Shared 共用' };
  var DATA_ZH = { real:'Real 真實資料', mock:'Mock 模擬資料', hybrid:'Hybrid' };
  var byId = {}; CAPS.forEach(function(c){ byId[c.id] = c; });

  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };

  /* ── Gate 0 提示 ── */
  $('gate-note').textContent = META.gate0 === 'pending'
    ? 'Gate 0 未核准 · 本頁為核准前實作'
    : 'Gate 0：' + (META.gate0 || 'unknown');

  /* ── 動態填篩選選項與圖例 ── */
  Object.keys(VOCAB).forEach(function(k){
    var o = document.createElement('option'); o.value = k;
    o.textContent = VOCAB[k] + '（' + k + '）'; $('f-status').appendChild(o);
    var li = document.createElement('span'); li.className = 'li';
    li.innerHTML = '<span class="badge b-' + k + '"><span class="gl">' + GLYPH[k] +
                   '</span>' + esc(VOCAB[k]) + '</span>';
    $('legend').appendChild(li);
  });
  (META.roadmapPhases || []).forEach(function(p){
    var o = document.createElement('option'); o.value = p;
    o.textContent = p === 'unscheduled' ? '未排期' : p; $('f-phase').appendChild(o);
  });

  /* ── 篩選狀態 ⇄ URL（可複製分享、重新整理不掉） ── */
  var F = { side:'', status:'', phase:'', data:'', doc:'', q:'' };
  function readURL(){
    var p = new URLSearchParams(location.search);
    Object.keys(F).forEach(function(k){ F[k] = p.get(k) || ''; });
  }
  function writeURL(){
    var p = new URLSearchParams();
    Object.keys(F).forEach(function(k){ if (F[k]) p.set(k, F[k]); });
    var qs = p.toString();
    history.replaceState(null, '', qs ? '?' + qs : location.pathname);
  }
  function syncControls(){
    $('f-side').value = F.side; $('f-status').value = F.status;
    $('f-phase').value = F.phase; $('f-data').value = F.data;
    $('f-doc').value = F.doc; $('f-q').value = F.q;
  }

  function match(c){
    if (F.side && c.side !== F.side) return false;
    if (F.status && c.implementationStatus !== F.status) return false;
    if (F.phase && c.roadmapPhase !== F.phase) return false;
    if (F.data && c.dataMode !== F.data) return false;
    if (F.doc === '1' && !c.technicalDocUrl) return false;
    if (F.q){
      var hay = [c.id, c.title, c.description, c.category, c.salesKitReference,
                 c.salesMessage, c.notes].join(' ').toLowerCase();
      if (hay.indexOf(F.q.toLowerCase()) === -1) return false;
    }
    return true;
  }

  function badge(c){
    var s = c.implementationStatus;
    return '<span class="badge b-' + esc(s) + '"><span class="gl">' + (GLYPH[s] || '·') +
           '</span>' + esc(VOCAB[s] || s) + '</span>';
  }

  function card(c){
    var h = ['<article class="card">'];
    h.push('<div class="meta">' + badge(c) +
           '<span class="chip"><b>' + esc(c.id) + '</b></span>' +
           '<span class="chip">' + esc(c.roadmapPhase === 'unscheduled' ? '未排期' : c.roadmapPhase) + '</span>' +
           '<span class="chip">' + esc(DATA_ZH[c.dataMode] || c.dataMode) + '</span>' +
           '</div>');
    h.push('<h3>' + esc(c.title) + '</h3>');
    h.push('<p class="desc">' + esc(c.description) + '</p>');

    var chips = ['<span class="chip">' + esc(SIDE_ZH[c.side] || c.side) + '</span>',
                 '<span class="chip">' + esc(c.category) + '</span>'];
    if (c.salesKitReference) chips.push('<span class="chip">Sales Kit <b>' + esc(c.salesKitReference) + '</b></span>');
    (c.designSystemReferences || []).forEach(function(d){
      chips.push('<span class="chip">' + esc(d) + '</span>');
    });
    h.push('<div class="meta">' + chips.join('') + '</div>');

    if (c.notes){
      var blocked = /⛔|BLOCKED/.test(c.notes) ||
                    /^BLOCKED/.test(c.bizTemplateReference || '');
      h.push('<p class="note' + (blocked ? ' blocked' : '') + '">' + esc(c.notes) + '</p>');
    }

    var a = [];
    if (c.demoRoute){
      var ext = /^https?:/.test(c.demoRoute);
      a.push('<a class="act primary" href="' + esc(c.demoRoute) + '"' +
             (ext ? ' target="_blank" rel="noopener noreferrer"' : '') + '>開啟 Demo' +
             (ext ? ' ↗' : '') + '</a>');
    } else {
      /* 沒有 demoRoute 就不給可點的入口——planned 被誤認為 live 是本案要防的第一件事 */
      a.push('<span class="act muted" aria-disabled="true">尚無 Demo</span>');
    }
    if (c.technicalDocUrl) a.push('<a class="act" href="' + esc(c.technicalDocUrl) + '">技術文件</a>');
    (c.counterpartIds || []).forEach(function(o){
      var m = byId[o]; if (!m) return;
      var label = c.side === 'user' ? '對應商家端' : '使用者會看到';
      a.push('<a class="act" href="?q=' + encodeURIComponent(o) + '">' + label + '：' + esc(m.title) + '</a>');
    });
    h.push('<div class="actions">' + a.join('') + '</div>');
    if (c.lastVerifiedAt) h.push('<div class="verified">最後驗證 ' + esc(c.lastVerifiedAt) + '</div>');
    h.push('</article>');
    return h.join('');
  }

  var SECTIONS = [
    { key:'user',   label:'USER SIDE　使用者端' },
    { key:'biz',    label:'BIZ SIDE　商家端' },
    { key:'shared', label:'SHARED　共用與導覽' }
  ];

  function render(){
    var hits = CAPS.filter(match);
    $('f-count').innerHTML = '符合 <b>' + hits.length + '</b> / ' + CAPS.length + ' 項';
    if (!hits.length){
      $('out').innerHTML = '<div class="empty">沒有符合條件的功能。<br>' +
        '試著放寬條件，或按「清除條件」看全部 ' + CAPS.length + ' 項。</div>';
      return;
    }
    var out = [];
    SECTIONS.forEach(function(s){
      var list = hits.filter(function(c){ return c.side === s.key; });
      if (!list.length) return;
      out.push('<h2>' + s.label + '<span class="n">' + list.length + ' 項</span></h2>');
      out.push('<div class="grid">' + list.map(card).join('') + '</div>');
    });
    $('out').innerHTML = out.join('');
  }

  function bind(id, key){
    $(id).addEventListener('input', function(){
      F[key] = this.value; writeURL(); render();
    });
  }
  bind('f-side','side'); bind('f-status','status'); bind('f-phase','phase');
  bind('f-data','data'); bind('f-doc','doc'); bind('f-q','q');
  $('f-reset').addEventListener('click', function(){
    Object.keys(F).forEach(function(k){ F[k] = ''; });
    syncControls(); writeURL(); render();
  });
  window.addEventListener('popstate', function(){ readURL(); syncControls(); render(); });

  readURL(); syncControls(); render();
})();
</script>
</body>
</html>
